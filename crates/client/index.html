<!doctype html>
<!-- trunk가 이 파일을 읽어서 warship-client를 wasm으로 빌드하고, 불러오는 코드를 아래에 넣습니다.
     실행: crates/client에서 `trunk serve` 뒤에 http://127.0.0.1:8080/ 를 엽니다.
     배포용 빌드: `trunk build --release --cargo-profile wasm-release` (wasm-opt로 크기를 더 줄입니다). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WARSHIP</title>
    <!-- wasm-opt는 러스트가 쓰는 WebAssembly 기능을 켜 주어야 파일을 읽습니다. -->
    <link
      data-trunk
      rel="rust"
      data-bin="warship-client"
      data-wasm-opt="s"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <!-- 에셋 폴더를 그대로 배포 폴더에 복사합니다. 클라이언트가 실행 중에 여기서 아이콘과 글꼴을 불러옵니다. -->
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d1b26; overflow: hidden; }
      #bevy { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
  </body>
</html>
